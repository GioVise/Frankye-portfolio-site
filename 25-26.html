   <script>
        // 1. SELEZIONE ELEMENTI
        const treeContainer = document.getElementById('avvento-tree');
        const treeItems = document.querySelectorAll('.advent-item');
        const lightbox = document.getElementById('advent-lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const closeBtn = document.querySelector('.close-btn');

        const storageKey = treeContainer.getAttribute('data-name') || 'calendario_default';

        console.log("Sto usando la memoria:", storageKey); //   Per debug (F12)

        // 2. FUNZIONE: CARICA LA MEMORIA ALL'AVVIO
        function loadOpenedDoors() {
            const savedDoors = JSON.parse(localStorage.getItem(storageKey)) || [];

            savedDoors.forEach(day => {
                // Cerca la casella con quel data-day
                const itemToOpen = document.querySelector(`.advent-item[data-day="${day}"]`);
                if (itemToOpen) {
                    itemToOpen.classList.remove('closed');
                }
            });
        }

        // Esegui subito all'avvio
        loadOpenedDoors();

        // 3. FUNZIONE: GESTIONE CLICK SUL CALENDARIO
        function handleAdventClick(element) {
            /*rendo inutilizzabile la parte che blocca le caselle visto che è passato interamente dicembre 2025.
            Se volessi riattivarla, togli i commenti a questa parte e alla parte superiore della funzione.ù

            
            const dayNumber = parseInt(element.getAttribute('data-day')); 

            const today = new Date();
            const currentDay = today.getDate();
            const currentMonth = today.getMonth(); // Mese (11 = Dicembre)

            //Se NON siamo a Dicembre (11) OPPURE se il giorno della casella è maggiore di oggi
            const isFuture = (currentMonth !== 11) || (dayNumber > currentDay); 

            
            if (isFuture) {
                
                if (!element.classList.contains('closed')) return;

                const img = element.querySelector('img');
                const originalSrc = img.src;

                // A2. CAMBIA L'IMMAGINE CON QUELLA DI BLOCCO
                img.src = "images/NonGuardare.webp"; // Immagine del lucchetto
            
                // A3. Apri la porta (visuale)
                element.classList.remove('closed');
                // A4. Dopo un po', richiudi la porta e rimetti l'immagine originale
                setTimeout(() => {
                    element.classList.add('closed');

                    setTimeout(() => {
                        img.src = originalSrc;
                    }, 600);
                    
                }, 2500); // Tempo che la porta rimane aperta col lucchetto
 
                //Non salvare nulla in memoria.
                return; 
            }
                */

            
            if (element.classList.contains('closed')) {
                // Apri visivamente
                element.classList.remove('closed');
                
                // Salva in memoria
                const savedDoors = JSON.parse(localStorage.getItem(storageKey)) || [];

                // Ricordati di convertire dayNumber in stringa se l'array salva stringhe
                const dayString = dayNumber.toString();
                
                if (!savedDoors.includes(dayString)) {
                    savedDoors.push(dayString);
                    localStorage.setItem(storageKey, JSON.stringify(savedDoors));
                }
                
                return; 
            }

            const img = element.querySelector('img');
            if (img) {
                lightboxImg.src = img.src;
                if(typeof lightboxCaption !== 'undefined' && lightboxCaption) {
                    lightboxCaption.textContent = img.alt;
                }
                lightbox.classList.add('active');
                document.body.classList.add('no-scroll');
            }
        }


        // 4. ASSEGNAZIONE EVENTI (Mouse e Tastiera)
        treeItems.forEach(item => {
            
            // Click col mouse
            item.addEventListener('click', function(e) {
                e.preventDefault(); // Evita comportamenti strani
                handleAdventClick(this);
            });

            // Accessibilità Tastiera (Invio o Spazio)
            item.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault(); // Evita lo scroll con spazio
                    handleAdventClick(this);
                }
            });
        });


        // 5. CHIUSURA LIGHTBOX
        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.classList.remove('no-scroll');
        }

        // Chiudi con la X (se esiste il bottone)
        if(closeBtn) closeBtn.addEventListener('click', closeLightbox);

        // Chiudi cliccando fuori
        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });
        // --- LOGICA PULSANTE RESET ---
        const resetBtn = document.getElementById('reset-btn');

        if (resetBtn) {
            resetBtn.addEventListener('click', function() {
                
                // 1. Chiedi conferma per evitare click per sbaglio
                if (confirm("Vuoi tu davvero richiudere tutte le caselle? Questa azione non può essere annullata, tristemente.")) {
                    
                    // 2. Cancella la memoria del browser
                    localStorage.removeItem(storageKey);
                    
                    // 3. Richiudi visivamente tutte le porte
                    const allItems = document.querySelectorAll('.advent-item');
                    allItems.forEach(item => {
                        item.classList.add('closed');
                    });
                }
            });
        }
